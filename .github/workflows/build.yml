name: Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'main' ]

env:
  java-version: 11

jobs:
  build:
    name: Build ${{ matrix.os }} distributions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: '*setup.exe'
            
          - os: macos-latest
            artifact: '*macos.dmg'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Set up JDK ${{ env.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ env.java-version }}'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: |
          winget install NSIS.NSIS --silent --accept-source-agreements --accept-package-agreements
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Download OSMesa for Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Generated by ChatGPT
          $version = "25.0.7"
          $archive = "$env:RUNNER_TEMP\mesa3d-$version-release-msvc.7z"
          $extract = "$env:RUNNER_TEMP\mesa-$version"
          
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          
          Invoke-WebRequest -Uri $url -OutFile $archive
          
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$extract" -y
          
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Mesa archive"
          }
          
          $osmesa = "$extract\x64\osmesa.dll"
          
          if (!(Test-Path $osmesa)) {
            throw "osmesa.dll not found in Mesa x64 package"
          }
          
          Write-Host "Found OSMesa: $osmesa"
          Get-Item $osmesa | Select-Object FullName, Length
          
          # Make OSMesa and sibling DLLs available to subsequent steps.
          "$extract\x64" >> $env:GITHUB_PATH

      - name: Install MacOS test environment dependencies
        if: runner.os == 'macOS'
        run: brew install coreutils llvm

      - name: Set Mesa install prefix
        if: runner.os == 'macOS'
        id: mesa-prefix
        shell: bash
        run: |
          MESA_PREFIX="$RUNNER_TEMP/mesa-install"
          echo "path=$MESA_PREFIX" >> "$GITHUB_OUTPUT"
          echo "MESA_PREFIX=$MESA_PREFIX" >> "$GITHUB_ENV"

      - name: Compute OSMesa cache key
        if: runner.os == 'macOS'
        id: osmesa-key
        env:
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/build.yml') }}
        run: echo "key=osmesa-mesa-25.0.7-${{ runner.os }}-${{ runner.arch }}-llvm-${WORKFLOW_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache compiled OSMesa
        if: runner.os == 'macOS'
        id: osmesa-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.mesa-prefix.outputs.path }}
          key: ${{ steps.osmesa-key.outputs.key }}

      - name: Install Mesa build dependencies for MacOS
        if: runner.os == 'macOS' && steps.osmesa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Generated by ChatGPT
          brew install pkg-config meson ninja
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          source "$RUNNER_TEMP/mesa-venv/bin/activate"
          python -m pip install mako packaging pyyaml

      - name: Download Mesa source code
        if: runner.os == 'macOS' && steps.osmesa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Generated by ChatGPT
          git clone --depth 1 --branch mesa-25.0.7 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$RUNNER_TEMP/mesa-src"

      - name: Build OSMesa for MacOS
        if: runner.os == 'macOS' && steps.osmesa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Generated by ChatGPT
          source "$RUNNER_TEMP/mesa-venv/bin/activate"
          
          export LLVM_PREFIX="$(brew --prefix llvm)"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          
          MESA_SRC="$RUNNER_TEMP/mesa-src"
          
          meson setup "$MESA_SRC/build" "$MESA_SRC" \
            --prefix="$MESA_PREFIX" \
            -Dosmesa=true \
            -Dgallium-drivers=swrast \
            -Dvulkan-drivers=[] \
            -Dplatforms=[] \
            -Dxlib-lease=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=enabled
          
          meson compile -C "$MESA_SRC/build"
          meson install -C "$MESA_SRC/build"
          
          echo "Installed OSMesa libraries:"
          find "$MESA_PREFIX" -name 'libOSMesa*.dylib' -print

      - name: Save OSMesa cache
        if: runner.os == 'macOS' && steps.osmesa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.mesa-prefix.outputs.path }}
          key: ${{ steps.osmesa-key.outputs.key }}

      - name: Prepare OSMesa for GLFW on MacOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Generated by ChatGPT
          LLVM_PREFIX="$(brew --prefix llvm)"
          
          OSMESA_LIB="$(find "$MESA_PREFIX" \
           -name 'libOSMesa*.dylib' -type f -print -quit)"
          
          if [[ -z "$OSMESA_LIB" ]]; then
            echo "Mesa build did not produce a regular OSMesa library file"
            find "$MESA_PREFIX" -name '*OSMesa*' -print
            exit 1
          fi
        
          echo "OSMesa library: $OSMESA_LIB"
          otool -L "$OSMESA_LIB"
          
          # GLFW's macOS loader looks for this specific library name.
          mkdir -p "$MESA_PREFIX/lib"
          TARGET="$MESA_PREFIX/lib/libOSMesa.8.dylib"
          if [[ "$OSMESA_LIB" != "$TARGET" ]]; then
            ln -sf "$OSMESA_LIB" "$TARGET"
          fi
          
          echo "DYLD_LIBRARY_PATH=$MESA_PREFIX/lib:$MESA_PREFIX/lib/gallium:$LLVM_PREFIX/lib" \
            >> "$GITHUB_ENV"
          
          otool -L "$OSMESA_LIB"
          
          find "$MESA_PREFIX" -name 'libOSMesa*.dylib' -exec ls -l {} \;

      - name: Maven build and install
        run: mvn --batch-mode --update-snapshots install

      - name: Store build directory
        id: build-dir
        shell: bash
        run: |
          BUILD_DIR=$(mvn help:evaluate -f app/pom.xml -Dexpression=project.build.directory -q -DforceStdout)
          BUILD_DIR="${BUILD_DIR//\\//}"
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE//\\//}"
          BUILD_DIR="${BUILD_DIR#"$GITHUB_WORKSPACE"/}"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}.zip
          path: ${{ steps.build-dir.outputs.BUILD_DIR }}/*.zip

      - name: Smoke test Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.build-dir.outputs.BUILD_DIR }}
        run: |
          # Generated by ChatGPT
          $buildDir = Join-Path $env:GITHUB_WORKSPACE $env:BUILD_DIR
          $installer = Get-ChildItem $buildDir -Filter '*setup.exe' |
            Select-Object -First 1
          $standalone = Get-ChildItem $buildDir -Filter 'Kintsugi3DBuilder.exe' |
            Select-Object -First 1
          
          Write-Host $standalone
          Write-Host $installer

          if (!$standalone) { throw "Standalone executable not found" }
          if (!$installer) { throw "Installer not found" }
          
          $rodinProject = Join-Path $env:GITHUB_WORKSPACE "app\src\test\resources\Rodin\Rodin_psx.k3d"
          $katrinaFullerProject = Join-Path $env:GITHUB_WORKSPACE "app\src\test\resources\KatrinaFuller\KatrinaFuller_realitycapture.k3d"

          if (!(Test-Path -LiteralPath $rodinProject -PathType Leaf)) {
            throw "Rodin test project not found: $rodinProject"
          }
          if (!(Test-Path -LiteralPath $katrinaFullerProject -PathType Leaf)) {
            throw "Katrina Fuller test project not found: $katrinaFullerProject"
          }
          
          function Test-Launch($exe, $timer, $arguments = @()) {
            $p = Start-Process $exe.FullName -ArgumentList $arguments -PassThru -NoNewWindow
            if (!$p.WaitForExit($timer)) {
              Write-Host "Process remained running: $($exe.FullName)"
              # We need to kill the whole process tree, not just the launch4j executable.
              taskkill /F /T /PID $p.Id 2>&1 | ForEach-Object { Write-Host $_ }
              $p.WaitForExit()
            } else {
              throw "$($exe.FullName) exited with code $($p.ExitCode)"
            }
          }
          
          Write-Host $standalone

          # Test the standalone executable.
          Test-Launch $standalone 30000
          Write-Host "Standalone executable (no project) smoke test passed."

          Test-Launch $standalone 300000 "`"$rodinProject`""
          Write-Host "Standalone executable (Rodin) smoke test passed."

          Test-Launch $standalone 300000 "`"$katrinaFullerProject`""
          Write-Host "Standalone executable (Katrina Fuller) smoke test passed."

          # Install silently.
          $p = Start-Process $installer.FullName -ArgumentList '/S' -PassThru -NoNewWindow
          if (!$p.WaitForExit(600000)) {
            Stop-Process -Id $p.Id -Force
            throw "Installer timed out"
          }
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          Write-Host "Installer smoke test passed."

          $installDir = "$env:ProgramFiles\Kintsugi3DBuilder"
          
          Write-Host $installDir

          # Test the installed Builder.
          $builder = Get-ChildItem $installDir -Filter 'Kintsugi3DBuilder.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (!$builder) { throw "Kintsugi3DBuilder.exe not found" }
          
          Write-Host $builder

          Test-Launch $builder 30000
          Write-Host "Installed Builder smoke test passed."

          Test-Launch $builder 300000 "`"$rodinProject`""
          Write-Host "Installed Builder (Rodin) smoke test passed."

          Test-Launch $builder 300000 "`"$katrinaFullerProject`""
          Write-Host "Installed Builder (Katrina Fuller) smoke test passed."

          # Test the installed Viewer.
          $viewer = Get-ChildItem $installDir -Filter 'Kintsugi3DViewer.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (!$viewer) { throw "Kintsugi3DViewer.exe not found" }
          
          Write-Host $viewer

          Test-Launch $viewer 30000
          Write-Host "Installed Viewer smoke test passed."

          # Check for any processes still running
          Get-CimInstance Win32_Process |
            Where-Object {
              $_.ExecutablePath -like "$installDir\*"
            } |
            Select-Object ProcessId, Name, ExecutablePath, CommandLine

          # Test the uninstaller.
          $uninstaller = Get-ChildItem $installDir -Filter 'un*.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (!$uninstaller) { throw "Uninstaller not found" }
          
          Write-Host $uninstaller
          
          ## Run a temporary copy so the uninstaller can delete itself.
          #$tempUninstaller = Join-Path $env:TEMP "Kintsugi3DBuilder-uninstall.exe"
          #Copy-Item $uninstaller.FullName $tempUninstaller -Force

          $p = Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru -NoNewWindow
          if (!$p.WaitForExit(600000)) {
            Stop-Process -Id $p.Id -Force
            throw "Uninstaller timed out"
          }
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          
          # Wait up to 10 minutes for the uninstall to finish.
          $deadline = (Get-Date).AddMinutes(10)
          while ((Test-Path $installDir) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }

          # Verify that the entire install directory was removed.
          if (Test-Path $installDir) {
            Write-Host "Contents remaining after uninstall:"
              Get-ChildItem $installDir -Recurse -Force |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          
            # Try to remove files through PowerShell for debugging purposes
            try {
              Remove-Item $installDir -Recurse -Force -ErrorAction Stop
              Write-Host "PowerShell successfully removed the installation directory."
            } catch {
              Write-Host "PowerShell deletion error: $($_.Exception.Message)"
              Write-Host $_.Exception.ToString()
            }
          
            throw "Uninstaller did not remove installation directory: $installDir"
          }

          Write-Host "Uninstaller smoke test passed."
          Write-Host "All Windows smoke tests passed successfully."

      - name: Smoke test macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_DIR: ${{ steps.build-dir.outputs.BUILD_DIR }}
        run: |
          # Generated by ChatGPT
          set -euo pipefail
          
          BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR"

          Gtimeout="$(brew --prefix coreutils)/bin/gtimeout"
          DMG="$(find "$BUILD_DIR" -maxdepth 1 -name '*macos.dmg' -print -quit)"

          test -n "$DMG" || { echo "DMG not found"; exit 1; }

          # Mount the DMG and extract both applications.
          TEMP_DIR="$(mktemp -d)"
          MOUNT="$TEMP_DIR/mount"
          EXTRACT_DIR="$TEMP_DIR/extracted"
          mkdir "$MOUNT" "$EXTRACT_DIR"

          cleanup() {
            hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
            rm -rf "$TEMP_DIR"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"

          BUILDER_FROM_DMG="$MOUNT/Kintsugi 3D Builder.app"
          VIEWER_FROM_DMG="$MOUNT/Kintsugi 3D Viewer.app"

          test -d "$BUILDER_FROM_DMG" ||
            { echo "Kintsugi 3D Builder.app not found in DMG"; exit 1; }
          test -d "$VIEWER_FROM_DMG" ||
            { echo "Kintsugi 3D Viewer.app not found in DMG"; exit 1; }

          cp -R "$BUILDER_FROM_DMG" "$EXTRACT_DIR/"
          cp -R "$VIEWER_FROM_DMG" "$EXTRACT_DIR/"

          hdiutil detach "$MOUNT"
          echo "Both applications extracted from DMG successfully."
          
          rodinProject="$GITHUB_WORKSPACE/app/src/test/resources/Rodin/Rodin_psx.k3d"
          katrinaFullerProject="$GITHUB_WORKSPACE/app/src/test/resources/KatrinaFuller/KatrinaFuller_realitycapture.k3d"

          test -f "$rodinProject" || { echo "Rodin test project not found"; exit 1; }
          test -f "$katrinaFullerProject" || { echo "Katrina Fuller test project not found"; exit 1; }
          
          # Test an app's executable directly, then launch it using open.
          smoke_test_app() {
            APP="$1"
            EXE="$2"
            LABEL="$3"
            TIMER="$4"
            PROJECT="${5:-}"

            test -d "$APP" || { echo "$LABEL: app bundle not found"; exit 1; }
            test -x "$EXE" || { echo "$LABEL: executable not found or not executable"; exit 1; }

            # Test 1: Run the executable directly, piping stdout and stderr to a log file.
            LOG="$(mktemp)"
            if [ -n "$PROJECT" ]; then
              "$EXE" "$PROJECT" > >(tee "$LOG") 2>&1 &
            else
              "$EXE" > >(tee "$LOG") 2>&1 &
            fi
            PID=$!
            sleep $TIMER

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            else
              if wait "$PID"; then STATUS=0; else STATUS=$?; fi
              echo "$LABEL: direct launch failed or exited within ${TIMER} seconds (code $STATUS)."
              exit 1
            fi
          
            # Check for errors in stdout / stderr.
            if grep -Eq 'ERROR|Exception in thread "' "$LOG"; then
              echo "$LABEL: ERROR or uncaught exception found in application output."
              cat "$LOG"
              rm -f "$LOG"
              exit 1
            fi
            rm -f "$LOG"
          
            echo "$LABEL: direct launch smoke test passed."

            # Test 2: Launch as a user would (but doesn't check stderr or stdout for errors).
            if [ -n "$PROJECT" ]; then
              if "$Gtimeout" --kill-after=5s "${TIMER}s" open -W -n "$APP" --args "$PROJECT"; then
                STATUS=0
              else
                STATUS=$?
              fi
            else
              if "$Gtimeout" --kill-after=5s "${TIMER}s" open -W -n "$APP"; then
                STATUS=0
              else
                STATUS=$?
              fi
            fi

            if [ "$STATUS" -eq 124 ]; then
              echo "$LABEL: open .app smoke test passed."
            else
              echo "$LABEL: open failed or exited within ${TIMER} seconds (code $STATUS)."
              exit 1
            fi
          }
          
          STAGING_DIR="$(find "$BUILD_DIR" -maxdepth 1 -type d \
            -name 'app-*' ! -name '*-macos.dmg' -print -quit)"

          # Test 1: Builder from the staging directory.
          BUILDER="$STAGING_DIR/Kintsugi 3D Builder.app"
          echo "$BUILDER"
          smoke_test_app "$BUILDER" \
            "$BUILDER/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (build directory)" 30
          smoke_test_app "$BUILDER" \
            "$BUILDER/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (build directory)" \
            300 "$rodinProject"
          smoke_test_app "$BUILDER" \
            "$BUILDER/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (build directory)" \
            300 "$katrinaFullerProject"

          # Test 2: Builder extracted from the DMG.
          BUILDER_EXTRACTED="$EXTRACT_DIR/Kintsugi 3D Builder.app"
          echo "$BUILDER_EXTRACTED"
          smoke_test_app "$BUILDER_EXTRACTED" \
            "$BUILDER_EXTRACTED/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (DMG)" 30
          smoke_test_app "$BUILDER_EXTRACTED" \
            "$BUILDER_EXTRACTED/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (DMG)" \
            300 "$rodinProject"
          smoke_test_app "$BUILDER_EXTRACTED" \
            "$BUILDER_EXTRACTED/Contents/MacOS/Kintsugi3DBuilder.sh" \
            "Builder (DMG)" \
            300 "$katrinaFullerProject"

          # Test 3: Viewer extracted from the DMG.
          VIEWER_EXTRACTED="$EXTRACT_DIR/Kintsugi 3D Viewer.app"
          echo "$VIEWER_EXTRACTED"
          smoke_test_app "$VIEWER_EXTRACTED" \
            "$VIEWER_EXTRACTED/Contents/MacOS/Kintsugi 3D Viewer" \
            "Viewer (DMG)" 30

          echo "All macOS smoke tests passed successfully."

      - name: Upload release
        shell: bash
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} ${{ steps.build-dir.outputs.BUILD_DIR }}/${{ matrix.artifact }} --clobber
          else
            gh release create ${{ github.ref_name }} ${{ steps.build-dir.outputs.BUILD_DIR }}/${{ matrix.artifact }} -t "${{ github.ref_name }}" -F RELEASE.md --draft
          fi
